<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Animated hourglass</title>
  <desc id="desc">Sand drains from the upper chamber, fills the lower chamber, then the hourglass turns over.</desc>
  <g fill="none" stroke="#d7192d" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <animateTransform attributeName="transform" type="rotate" values="0 32 32;0 32 32;180 32 32;180 32 32" keyTimes="0;0.76;0.88;1" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0 0 1;0.34 1 0.64 1;0.2 0 0 1"/>
    <path d="M18 12h28M18 52h28"/>
    <path d="M21 14c0 9 2.5 13.5 9.3 18C23.5 36.5 21 41 21 50h22c0-9-2.5-13.5-9.3-18C40.5 27.5 43 23 43 14Z" fill="#fff7f8"/>
    <path d="M24 18h16l-7.3 11.4h-1.4Z" fill="#d7192d" stroke="none">
      <animate attributeName="d" values="M24 18h16l-7.3 11.4h-1.4Z;M31.3 28.9h1.4l-.2.5h-1Z;M31.3 28.9h1.4l-.2.5h-1Z" keyTimes="0;0.68;1" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M31.5 35h1l.2.2h-1.4Z" fill="#d7192d" stroke="none">
      <animate attributeName="d" values="M31.5 35h1l.2.2h-1.4Z;M31.5 35h1L41 48H23Z;M31.5 35h1L41 48H23Z" keyTimes="0;0.68;1" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M32 30v13" stroke="#d7192d" stroke-width="2">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.62;0.7;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="1 3;4 2;1 3;1 3" keyTimes="0;0.2;0.68;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;-12;-24;-24" keyTimes="0;0.3;0.68;1" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
